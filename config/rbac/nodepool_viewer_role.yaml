# This rule is not used by the project k8s-nodepool-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to nodemanager.example.org.example.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-nodepool-controller
    app.kubernetes.io/managed-by: kustomize
  name: nodepool-viewer-role
rules:
- apiGroups:
  - nodemanager.example.org.example.org
  resources:
  - nodepools
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nodemanager.example.org.example.org
  resources:
  - nodepools/status
  verbs:
  - get
